<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>403 | Access Denied</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Segoe UI,sans-serif;background:#0b1220;color:#e2e8f0}
.box{max-width:460px;background:#111827;border:2px solid #7f1d1d;border-radius:16px;padding:32px;text-align:center;box-shadow:0 15px 40px rgba(127,29,29,.3)}
h1{color:#f87171;font-size:24px;margin:0 0 8px}
p{color:#94a3b8;font-size:14px;line-height:1.6;margin:12px 0}
b{color:#fca5a5}
a{display:inline-block;margin:8px;padding:12px 18px;background:#2563eb;color:#fff;border-radius:10px;text-decoration:none;font-weight:800;font-size:13px}
</style></head><body>
<div class="box">
  <h1>🚫 403 — Access Denied</h1>
  <p>This action is restricted to <b>Admin users only</b>.</p>
  <p>Logged in as: <b>{{ current_user }}</b> ({{ current_role|upper }})</p>
  <p>Contact your Admin to grant full access.</p>
  <a href="/">Dashboard</a>
  <a href="/profile">My Profile</a>
</div>
</body></html>
